[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnicyte"
version = "0.1.0"
description = "A desktop buddy that catches phishing in mail, chat and the browser."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
omnicyte = "omnicyte.__main__:main"

[tool.setuptools]
packages = ["omnicyte"]
