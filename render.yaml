services:
  - type: web
    name: mtrx-horizon
    runtime: docker
    plan: starter            # the free plan has no disk, so approved devices would be forgotten
    healthCheckPath: /healthz
    numInstances: 1
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: MTRX_TRUST_PROXY
        value: "1"
      - key: MTRX_DB_PATH
        value: /app/data/horizon.db
      - key: MTRX_SETUP_TOKEN
        generateValue: true  # base64, so it may hold "/", "+" or "="; the approval page takes them
      - key: MTRX_KNOCK
        sync: false          # you type this in yourself; it is never stored in the code
      - key: GENESIS_AI_KEY
        sync: false          # optional: Ask Genesis stays off until this and the model are set
      - key: GENESIS_AI_MODEL
        sync: false          # a current model id from Anthropic's model list
      - key: GENESIS_AI_DAILY_CAP_USD
        value: "2"
