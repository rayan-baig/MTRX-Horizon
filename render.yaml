services:
  - type: web
    name: mtrx-horizon
    runtime: docker
    plan: starter            # the free plan has no disk, so approved devices would be forgotten
    # Only "is it answering?". /readyz is for the uptime monitor: Render restarting
    # the site over a stopped job would hide it (docs/OPERATIONS.md).
    healthCheckPath: /healthz
    numInstances: 1
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: MTRX_TRUST_PROXY
        value: "1"
      - key: MTRX_DB_PATH
        value: /app/data/horizon.db
      # The live addresses. This Blueprint is the live site's only: staging is
      # made by hand with its own values (docs/STAGING.md), so none of these
      # reach it. MTRX_CONTACT_EMAIL is left to the dashboard (README,
      # "Business enquiries") so no link shows before the mailbox exists.
      - key: MTRX_PUBLIC_URL
        value: https://mtrxhorizyn.com
      - key: RANKUP_URL
        value: https://rankup.mtrxhorizyn.com
      - key: CYBERLOGIX_URL
        value: https://cyberlogix.mtrxhorizyn.com
      - key: OMNIARMOR_URL
        value: https://omniarmor.mtrxhorizyn.com
      # Which apps are open to the public (launched): rankup,cyberlogix,omniarmor
      # or all. Until an app is named here, every page says it is in
      # development and nothing links to its address. Set on launch day.
      - key: MTRX_OPEN_APPS
        sync: false
      - key: RANKUP_HEALTH_URL
        value: https://rankup.mtrxhorizyn.com/api/health
      - key: CYBERLOGIX_HEALTH_URL
        value: https://cyberlogix.mtrxhorizyn.com/api/health
      - key: OMNIARMOR_HEALTH_URL
        value: https://omniarmor.mtrxhorizyn.com/healthz
      - key: RANKUP_STATS_URL
        value: https://rankup.mtrxhorizyn.com/api/stats
      - key: CYBERLOGIX_STATS_URL
        value: https://cyberlogix.mtrxhorizyn.com/api/stats
      - key: OMNIARMOR_STATS_URL
        value: https://omniarmor.mtrxhorizyn.com/api/stats
      - key: MTRX_STATS_KEY
        sync: false          # the same long random key as each app's STATS_KEY
      - key: MTRX_SETUP_TOKEN
        generateValue: true  # base64, so it may hold "/", "+" or "="; the approval page takes them
      - key: MTRX_KNOCK
        sync: false          # you type this in yourself; it is never stored in the code
      - key: GENESIS_AI_KEY
        sync: false          # optional: Ask Genesis stays off until this and the model are set
      - key: GENESIS_AI_MODEL
        sync: false          # a current model id from Anthropic's model list
      - key: GENESIS_AI_DAILY_CAP_USD
        value: "2"
      # Genesis Pro (docs/GENESIS-PRO.md): off until switched on here and the
      # Stripe settings below are typed into the dashboard.
      - key: GENESIS_PRO_ENABLED
        value: "0"
      - key: STRIPE_SECRET_KEY
        sync: false          # a restricted key from Stripe; never stored in the code
      - key: GENESIS_PRO_STRIPE_WEBHOOK_SECRET
        sync: false          # the webhook endpoint's signing secret (whsec_...)
      - key: GENESIS_PRO_STRIPE_PRICE
        sync: false          # the monthly price id (price_...)
      - key: GENESIS_PRO_YEARLY_STRIPE_PRICE
        sync: false          # the yearly price id (price_...), ten months' price
      - key: GENESIS_PRO_MONTHLY_AI_USD
        value: "1.5"
      # Orbyt Pitch Review (docs/ORBYT-PITCH-REVIEW.md): off until switched on
      # here and its Stripe settings are typed into the dashboard. It uses
      # STRIPE_SECRET_KEY above, and needs MTRX_ALERT_EMAIL and email set up.
      - key: ORBYT_REVIEW_ENABLED
        value: "0"
      - key: ORBYT_REVIEW_STRIPE_WEBHOOK_SECRET
        sync: false          # the signing secret of the /api/orbyt/review/stripe endpoint (whsec_...)
      - key: ORBYT_REVIEW_STRIPE_PRICE
        sync: false          # the one-off price id (price_...)
      - key: ORBYT_REVIEW_PRICE_TEXT
        value: "$19"         # the price as the page writes it; keep it the same as Stripe's
      - key: ORBYT_REVIEW_DAYS
        value: "5"           # the review is emailed within this many days, or a full refund
      # AI mode: each paid review written by AI and emailed by itself, once
      # these three are typed into the dashboard (any OpenAI-compatible
      # service; a free tier works). ORBYT_REVIEW_MODE=person turns it off.
      - key: ORBYT_REVIEW_AI_URL
        sync: false          # the service's OpenAI-compatible address (https://...)
      - key: ORBYT_REVIEW_AI_KEY
        sync: false          # the service's key
      - key: ORBYT_REVIEW_AI_MODEL
        sync: false          # the name of a chat model from the service's list
      - key: ORBYT_REVIEW_AI_PER_DAY
        value: "20"          # the most AI calls in a UTC day
      - key: VORTEX_PER_HOUR
        value: "5"           # Orbyt messages each visitor may send an hour
      - key: VORTEX_PER_DAY
        value: "20"
      # The early access list and the creator program
      # (docs/EARLY-ACCESS-AND-CREATORS.md): off until switched on here.
      - key: EARLY_ACCESS_ENABLED
        value: "0"
      - key: FOUNDER_CODE_RANKUP
        sync: false          # a Stripe promotion code you make, such as FOUNDER20
      - key: FOUNDER_CODE_CYBERLOGIX
        sync: false
      - key: FOUNDER_CODE_OMNIARMOR
        sync: false
      - key: FOUNDER_PERCENT_OFF
        sync: false          # the percent those codes take off, such as 20
      - key: MTRX_POSTAL_ADDRESS
        sync: false          # the company's postal address; launch emails are blocked until it is set
      - key: EARLY_ACCESS_EMAIL_FROM
        sync: false          # the address early access and creator emails come from
      - key: EARLY_ACCESS_SEND_PER_MINUTE
        value: "20"
      - key: CREATORS_ENABLED
        value: "0"
      - key: CREATOR_PERCENT
        value: "20"
      - key: CREATOR_MONTHS
        value: "12"
