# Builds the Omnicyte desktop app for Windows, macOS and Linux, proves each
# one starts and works, and offers them as downloads. A tag like
# omnicyte-v0.2.0 also publishes them as a GitHub release.
name: Omnicyte app

on:
  push:
    branches: ['**']
    tags: ['omnicyte-v*']
    paths: ['omnicyte/**', '.github/workflows/omnicyte.yml']
  workflow_dispatch:

concurrency:
  group: omnicyte-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: macos-latest, name: macos }
          - { os: ubuntu-latest, name: linux }
    defaults:
      run:
        shell: bash
        working-directory: omnicyte
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Tk for the buddy's windows (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libtk8.6
      - run: python -m pip install pyinstaller==6.22.3 pillow==13.0.0 pytest
      - name: Tests
        run: python -m pytest -q tests
      - name: Build the app
        run: |
          python tools/make_icon.py packaging/icon.png 512
          pyinstaller packaging/omnicyte.spec --noconfirm

      # The packaged app itself must start and pass its own checks before anyone downloads it.
      - name: The app works (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Omnicyte.exe -ArgumentList 'self-test','--out','selftest.json' -Wait -PassThru
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - name: The app works (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/Omnicyte.app/Contents/MacOS/Omnicyte self-test --out selftest.json
          cat selftest.json
          /usr/libexec/PlistBuddy -c 'Print :LSUIElement' dist/Omnicyte.app/Contents/Info.plist
      - name: The app works (Linux)
        if: runner.os == 'Linux'
        run: dist/Omnicyte self-test --out selftest.json && cat selftest.json

      - name: Package
        run: |
          mkdir -p out
          case "${{ runner.os }}" in
            Windows) cp dist/Omnicyte.exe out/Omnicyte.exe ;;
            macOS)   ditto -c -k --keepParent dist/Omnicyte.app out/Omnicyte-macos.zip ;;
            Linux)   tar -C dist -czf out/Omnicyte-linux.tar.gz Omnicyte ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: Omnicyte-${{ matrix.name }}
          path: omnicyte/out/*
          if-no-files-found: error

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Every script parses, and the manifest is valid
        run: |
          for f in omnicyte/extension/*.js; do node --check "$f"; done
          python3 -c "import json; json.load(open('omnicyte/extension/manifest.json'))"
      - name: Package
        run: mkdir -p out && (cd omnicyte/extension && zip -r -X ../../out/Omnicyte-browser-extension.zip .)
      - uses: actions/upload-artifact@v7
        with:
          name: Omnicyte-browser-extension
          path: out/Omnicyte-browser-extension.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/omnicyte-v')
    needs: [app, extension]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la files
          gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" \
            --title "Omnicyte ${GITHUB_REF_NAME#omnicyte-v}" \
            --notes "Download the file for your computer. See omnicyte/INSTALL.md for first-run steps."
