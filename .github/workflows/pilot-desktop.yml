# Pilot for Mac: tests the app, builds one universal .dmg (Apple Silicon and
# Intel), and puts it on a GitHub Release named "Pilot for Mac vX.Y.Z".
#
# The app is signed and notarised only when these repository secrets exist:
# CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
# APPLE_TEAM_ID. Without them it's ad-hoc signed (see pilot-desktop/INSTALL.md).
name: Pilot for Mac

on:
  push:
    paths:
      - 'pilot-desktop/**'
      - '.github/workflows/pilot-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pilot-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pilot-desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pilot-desktop/package-lock.json
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: Smoke test (the real app, clicked by Playwright)
        run: node test/smoke/run-smoke.mjs --shots ../pilot-shots
      - name: Screenshots from the smoke test
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pilot-mac-screenshots
          path: pilot-shots/
          if-no-files-found: ignore
      - name: Build the universal .dmg
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Empty secrets count as missing, so signing stays off until all are set.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if [ -z "${CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; echo "No signing secrets: building an ad-hoc signed app."; fi
          npm run dist
      - name: Check the .dmg
        run: |
          set -euo pipefail
          DMG=$(ls dist/*.dmg)
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          hdiutil verify "$DMG"
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT"
          ls -la "$MNT"
          test -L "$MNT/Applications"
          lipo -archs "$MNT/Pilot.app/Contents/MacOS/Pilot" | tee archs.txt
          grep -q x86_64 archs.txt && grep -q arm64 archs.txt
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" "$MNT/Pilot.app/Contents/Info.plist" | grep -q true
          codesign --verify --deep --strict "$MNT/Pilot.app"
          codesign -dv "$MNT/Pilot.app" 2>&1 | grep -E "Signature|TeamIdentifier|Identifier" || true
          hdiutil detach "$MNT"
      - name: Upload the .dmg
        uses: actions/upload-artifact@v7
        with:
          name: pilot-mac-dmg
          path: pilot-desktop/dist/*.dmg
          if-no-files-found: error
      - name: Release "Pilot for Mac vX.Y.Z"
        if: github.event_name == 'workflow_dispatch' || github.ref_name == 'claude/trusting-carson-5aqdd1' || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="pilot-mac-v$VERSION"
          NAME=$(basename "$DMG")
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NAME}"
          sed -e "s|{{VERSION}}|$VERSION|g" -e "s|{{DMG_URL}}|$URL|g" RELEASE_NOTES.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
            gh release edit "$TAG" --title "Pilot for Mac v$VERSION" --notes-file notes.md
          else
            gh release create "$TAG" "$DMG" --title "Pilot for Mac v$VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          fi
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "Download: $URL" >> "$GITHUB_STEP_SUMMARY"
