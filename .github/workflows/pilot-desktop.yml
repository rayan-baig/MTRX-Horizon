# Pilot for Mac: tests the app, builds both editions as universal .dmgs
# (Apple Silicon and Intel), and puts both on a GitHub Release named
# "Pilot for Mac vX.Y.Z":
#   Pilot-X.Y.Z-mac.dmg       "Pilot", your own AI keys, plus Free mode
#   Pilot-Free-X.Y.Z-mac.dmg  "Pilot Free", Free mode only (AI on the Mac, no keys)
#
# The app is signed and notarised only when these repository secrets exist:
# CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
# APPLE_TEAM_ID. Without them it's ad-hoc signed (see pilot-desktop/INSTALL.md).
name: Pilot for Mac

on:
  push:
    paths:
      - 'pilot-desktop/**'
      - '.github/workflows/pilot-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pilot-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pilot-desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pilot-desktop/package-lock.json
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      # A tiny helper that moves and clicks the real system pointer, so the
      # smoke test also clicks the walking robot through macOS's own mouse
      # events and the click-through overlay (Playwright's clicks skip both).
      - name: Build the real-click helper (for the smoke test only, never shipped)
        run: swiftc -O test/smoke/realclick.swift -o "$RUNNER_TEMP/realclick"
      - name: Smoke test, Pilot (the real app, clicked by Playwright and by real system clicks)
        env:
          PILOT_REAL_CLICK: ${{ runner.temp }}/realclick
        run: node test/smoke/run-smoke.mjs --shots ../pilot-shots/pilot
      - name: Smoke test, Pilot Free
        env:
          PILOT_EDITION: free
          PILOT_REAL_CLICK: ${{ runner.temp }}/realclick
        run: node test/smoke/run-smoke.mjs --shots ../pilot-shots/free
      - name: Screenshots from the smoke test
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pilot-mac-screenshots
          path: pilot-shots/
          if-no-files-found: ignore
      - name: Build both universal .dmgs (Pilot, then Pilot Free)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Empty secrets count as missing, so signing stays off until all are set.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if [ -z "${CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; echo "No signing secrets: building an ad-hoc signed app."; fi
          npm run dist
          npm run dist:free
      - name: Check both .dmgs
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          DMG="dist/Pilot-$VERSION-mac.dmg"
          FREE_DMG="dist-free/Pilot-Free-$VERSION-mac.dmg"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          echo "FREE_DMG=$FREE_DMG" >> "$GITHUB_ENV"
          check() {
            local dmg="$1" app="$2" id="$3" edition="$4"
            hdiutil verify "$dmg"
            MNT=$(mktemp -d)
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$MNT"
            ls -la "$MNT"
            test -L "$MNT/Applications"
            lipo -archs "$MNT/$app.app/Contents/MacOS/$app" | tee archs.txt
            grep -q x86_64 archs.txt && grep -q arm64 archs.txt
            /usr/libexec/PlistBuddy -c "Print :LSUIElement" "$MNT/$app.app/Contents/Info.plist" | grep -q true
            test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$MNT/$app.app/Contents/Info.plist")" = "$id"
            # The packaged app knows its edition (written by electron-builder's extraMetadata).
            X=$(mktemp -d)
            (cd "$X" && "$GITHUB_WORKSPACE/pilot-desktop/node_modules/.bin/asar" extract-file "$MNT/$app.app/Contents/Resources/app.asar" package.json)
            node -e "const p=require(process.argv[1]);if(p.pilotEdition!==process.argv[2]||p.productName!==process.argv[3])process.exit(1)" "$X/package.json" "$edition" "$app"
            rm -rf "$X"
            codesign --verify --deep --strict "$MNT/$app.app"
            codesign -dv "$MNT/$app.app" 2>&1 | grep -E "Signature|TeamIdentifier|Identifier" || true
            hdiutil detach "$MNT"
          }
          check "$DMG" "Pilot" "com.mtrxhorizyn.pilot" "pilot"
          check "$FREE_DMG" "Pilot Free" "com.mtrxhorizyn.pilot.free" "free"
      - name: Upload the .dmgs
        uses: actions/upload-artifact@v7
        with:
          name: pilot-mac-dmg
          path: |
            pilot-desktop/dist/*.dmg
            pilot-desktop/dist-free/*.dmg
          if-no-files-found: error
      - name: Release "Pilot for Mac vX.Y.Z"
        if: github.event_name == 'workflow_dispatch' || github.ref_name == 'claude/trusting-carson-5aqdd1' || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="pilot-mac-v$VERSION"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          URL="$BASE/$(basename "$DMG")"
          FREE_URL="$BASE/$(basename "$FREE_DMG")"
          sed -e "s|{{VERSION}}|$VERSION|g" -e "s|{{DMG_URL}}|$URL|g" -e "s|{{FREE_DMG_URL}}|$FREE_URL|g" RELEASE_NOTES.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" "$FREE_DMG" --clobber
            gh release edit "$TAG" --title "Pilot for Mac v$VERSION" --notes-file notes.md
          else
            gh release create "$TAG" "$DMG" "$FREE_DMG" --title "Pilot for Mac v$VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          fi
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pilot (your own keys + Free mode): $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Pilot Free (Free mode only): $FREE_URL" >> "$GITHUB_STEP_SUMMARY"
