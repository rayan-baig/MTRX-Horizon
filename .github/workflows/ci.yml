# Every push runs the tests and builds the production image.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch cancels the run it replaces, so CI time
# goes on the code that is actually there now.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'   # what the Dockerfile ships
          cache: pip
      - run: pip install -r requirements.txt -c constraints.txt pytest httpx pip-audit
      - name: Tests
        # tests/test_live.py walks the owner's way in against real uvicorn from
        # 127.0.0.1 and ::1. Without this it would skip ::1 on a runner with no
        # IPv6, and an IPv6 address mistake could pass unseen.
        env:
          MTRX_REQUIRE_IPV6: '1'
        run: python -m pytest -q
      - name: Known security holes in dependencies
        run: pip-audit -r constraints.txt
      - name: The production image builds
        run: docker build -t horizon:ci .
      - name: Every script parses
        run: for f in static/js/*.js horizon/private/*.js; do node --check "$f"; done
      - name: The image starts, answers, and runs as the horizon user
        run: |
          docker volume create horizon-data
          docker run -d --name horizon -p 8000:8000 -v horizon-data:/app/data \
            -e MTRX_SETUP_TOKEN=ci-setup-token-1234567890 horizon:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:8000/healthz
          test "$(docker exec horizon sh -c 'ps -o user= -p 1 2>/dev/null || stat -c %U /proc/1')" = horizon
          docker exec -u horizon horizon test -O /app/data/horizon.db
          docker logs horizon | tail -20
