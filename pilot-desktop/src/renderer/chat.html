<!doctype html>
<html lang="en" data-theme="blue">
<head>
<meta charset="utf-8">
<title>Pilot</title>
<link rel="stylesheet" href="chat.css">
<script src="../core/pilot-render.js" defer></script>
<script src="attach.js" defer></script>
<script src="links.js" defer></script>
<script src="speech.js" defer></script>
<script src="chat.js" defer></script>
</head>
<body>
<svg class="defs" aria-hidden="true" width="0" height="0" focusable="false">
  <defs>
    <linearGradient id="g-icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6cc8ff"/>
      <stop offset="1" stop-color="#2f80ff"/>
    </linearGradient>
    <linearGradient id="g-plane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fd0ff"/>
      <stop offset="1" stop-color="#9b8cff"/>
    </linearGradient>
    <linearGradient id="g-p" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7fdcff"/>
      <stop offset="0.45" stop-color="#2f86ff"/>
      <stop offset="1" stop-color="#3346f5"/>
    </linearGradient>
    <linearGradient id="g-orbit" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0" stop-color="#3a8dff"/>
      <stop offset="0.55" stop-color="#4f7dff"/>
      <stop offset="1" stop-color="#9b6bff"/>
    </linearGradient>
  </defs>
</svg>

<div class="stage">
  <button id="byok" class="byok" type="button">
    <svg class="byok-key" viewBox="0 0 24 24" aria-hidden="true"><circle cx="15.5" cy="8.5" r="5"/><circle cx="15.5" cy="8.5" r="1.6"/><path d="M12 12 3.5 20.5M6.2 17.8l2.3 2.3M8.4 15.6l1.8 1.8"/></svg>
    <span class="byok-words">
      <span class="byok-title">Bring Your Own API Key</span>
      <span class="byok-sub">Use your OpenAI, Claude, Gemini, or any compatible API key.</span>
    </span>
    <svg class="byok-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
  </button>

  <main id="panel" class="panel">
    <div class="winbtns">
      <button id="min" class="winbtn" type="button" aria-label="Hide the chat" title="Hide the chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <button id="close" class="winbtn" type="button" aria-label="Close the chat" title="Close the chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>

    <header class="brand">
      <svg class="logo" viewBox="0 0 124 92" aria-hidden="true">
        <ellipse class="orbit-back" cx="62" cy="50" rx="57" ry="17" transform="rotate(-17 62 50)"/>
        <path class="p-mark" fill-rule="evenodd" d="M33 86 47.5 12H78c16 0 25 9.5 22.4 23.5C97.8 50 85.5 58 69 58H58.6L53.2 86Zm27.6-43h8.6c7.4 0 12.3-3.6 13.4-9 1-5.2-2.2-8.2-8-8.2h-9.9Z"/>
        <path class="orbit-front" d="M8.5 66.6A57 17 -17 0 0 115.5 33.4"/>
      </svg>
      <div class="brand-words">
        <h1>Pilot</h1>
        <p class="tagline">Your AI copilot. Powered by you.</p>
      </div>
    </header>

    <section id="view-chat" class="view view-chat" aria-label="Chat">
      <div id="scroll" class="scroll">
        <div class="bubble greet">
          <svg class="sparkle" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5c.9 6.4 3.9 9.6 10.5 10.5-6.6.9-9.6 4.1-10.5 10.5C11.1 16.1 8.1 12.9 1.5 12 8.1 11.1 11.1 7.9 12 1.5Z"/></svg>
          <p>Hello! I'm Pilot.<br>How can I help you today?</p>
        </div>
        <ul id="chips" class="chips">
          <li><button class="chip" type="button" data-chip="ask"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 4v-4h0A2.5 2.5 0 0 1 4 13.5Z"/><circle class="fill" cx="8.5" cy="9.5" r="1"/><circle class="fill" cx="12" cy="9.5" r="1"/><circle class="fill" cx="15.5" cy="9.5" r="1"/></svg><span>Ask anything…</span></button></li>
          <li><button class="chip" type="button" data-chip="do"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="solid" d="M13.5 2 4.5 13.5h6.5L9.5 22l9-12h-6.5Z"/></svg><span>Get things done…</span></button></li>
          <li><button class="chip" type="button" data-chip="code"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6.5 2.5 12 8 17.5M16 6.5l5.5 5.5-5.5 5.5M14 4l-4 16"/></svg><span>Help with code…</span></button></li>
          <li><button class="chip" type="button" data-chip="explain"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="12" width="4.5" height="8" rx="1.2"/><rect x="9.75" y="8" width="4.5" height="12" rx="1.2"/><rect x="16.5" y="4" width="4.5" height="16" rx="1.2"/></svg><span>Analyze &amp; explain…</span></button></li>
          <li><button class="chip" type="button" data-chip="key"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="solid" fill-rule="evenodd" d="M10.3 2h3.4l.5 2.6c.6.2 1.2.5 1.7.9l2.5-.9 1.7 2.9-2 1.8a6 6 0 0 1 0 1.9l2 1.7-1.7 3-2.5-.9c-.5.4-1.1.7-1.7.9l-.5 2.6h-3.4l-.5-2.6c-.6-.2-1.2-.5-1.7-.9l-2.5.9-1.7-3 2-1.7a6 6 0 0 1 0-1.9l-2-1.8 1.7-2.9 2.5.9c.5-.4 1.1-.7 1.7-.9ZM12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8Z" transform="translate(0 1.5)"/></svg><span>Customize with your API key</span></button></li>
        </ul>
        <div id="messages" class="messages" role="log" aria-live="polite"></div>
      </div>

      <div id="looking" class="looking" role="status" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Pilot is looking at your screen…</span>
      </div>
      <div id="attach" class="attach" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="attach-words">A screenshot will be sent with your next message.</span>
        <button id="attach-x" class="attach-x" type="button" aria-label="Don't send a screenshot">×</button>
      </div>

      <div id="eye-menu" class="menu eye-menu" role="menu" hidden>
        <button type="button" role="menuitem" data-eye="look">Look at my screen<small>Send a screenshot with my next message</small></button>
        <button type="button" role="menuitem" data-eye="explain">Explain this screen</button>
        <button type="button" role="menuitem" data-eye="summary">Summarise what I'm looking at</button>
        <button type="button" role="menuitemcheckbox" data-eye="help" aria-checked="false">Help with what's on screen<small id="help-state">Off: turn on to send a fresh screenshot with each message</small></button>
      </div>

      <div id="tray" class="tray" aria-label="Pictures and videos for your next message" hidden></div>
      <div id="linkbar" class="linkbar" aria-label="Links in your message" hidden></div>
      <div id="dropzone" class="dropzone" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0L7.5 8.5M12 4l4.5 4.5M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
        <strong>Drop pictures or videos</strong>
        <span>Any size. Pilot shrinks them to fit, and sends them only to your own AI provider.</span>
      </div>
      <form id="composer" class="composer" autocomplete="off">
        <input id="file" class="file" type="file" multiple accept="image/*,video/*,.heic,.heif,.mov,.mkv" tabindex="-1" aria-hidden="true">
        <button id="clip" class="clip" type="button" aria-label="Add pictures or videos" title="Add pictures or videos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.5 12 20a5.5 5.5 0 0 1-7.8-7.8l8.9-8.9a3.7 3.7 0 0 1 5.2 5.2l-8.9 8.9a1.8 1.8 0 0 1-2.6-2.6l8.2-8.2"/></svg></button>
        <textarea id="input" rows="1" maxlength="8000" placeholder="Type a message..." aria-label="Message Pilot"></textarea>
        <button id="eye" class="eye" type="button" aria-label="Look at my screen" title="Look at my screen" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button id="send" class="send" type="submit" aria-label="Send" title="Send"><svg class="plane" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.5 2.5 2.5 10.2l7.6 3.1 3.1 7.6Z"/><path d="m21.5 2.5-11.4 10.8"/></svg><svg class="stopsq" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg></button>
      </form>
    </section>

    <section id="view-settings" class="view view-page" aria-label="Settings" hidden></section>
    <section id="view-help" class="view view-page" aria-label="Help" hidden></section>

    <footer class="bottom">
      <div id="palette-menu" class="menu palette-menu" role="menu" hidden>
        <button type="button" role="menuitemradio" data-theme-pick="blue" aria-label="Blue"><span class="swatch swatch-blue"></span>Blue</button>
        <button type="button" role="menuitemradio" data-theme-pick="violet" aria-label="Violet"><span class="swatch swatch-violet"></span>Violet</button>
        <button type="button" role="menuitemradio" data-theme-pick="aurora" aria-label="Aurora"><span class="swatch swatch-aurora"></span>Aurora</button>
      </div>
      <button id="gear" class="round" type="button" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 2.5h3.4l.5 2.5c.6.2 1.2.6 1.7 1l2.4-.8 1.7 2.9-1.9 1.7c.1.6.1 1.3 0 1.9l1.9 1.7-1.7 2.9-2.4-.8c-.5.4-1.1.8-1.7 1l-.5 2.5h-3.4l-.5-2.5c-.6-.2-1.2-.6-1.7-1l-2.4.8-1.7-2.9 1.9-1.7a6 6 0 0 1 0-1.9L4 8.1l1.7-2.9 2.4.8c.5-.4 1.1-.8 1.7-1Z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button id="speak" class="round" type="button" aria-label="Speak replies" title="Speak replies (off)" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4Z"/><path class="wave1" d="M15.5 9.2a4 4 0 0 1 0 5.6"/><path class="wave2" d="M18 6.8a7.4 7.4 0 0 1 0 10.4"/><path class="off" d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></svg></button>
      <button id="palette" class="round" type="button" aria-label="Colours" title="Colours" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0 0 18c1.4 0 2-.9 2-1.8 0-1.3-1.2-1.6-1.2-2.7 0-1 .8-1.7 1.9-1.7H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3Z"/><circle class="fill" cx="7.5" cy="11" r="1.4"/><circle class="fill" cx="10" cy="7" r="1.4"/><circle class="fill" cx="14.5" cy="7" r="1.4"/></svg></button>
      <button id="helpbtn" class="round" type="button" aria-label="Help" title="Help"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.8 9a3.3 3.3 0 0 1 6.4 1c0 2.2-3.2 2.8-3.2 4.9"/><circle class="fill" cx="12" cy="18.2" r="1.2"/></svg></button>
    </footer>
  </main>
</div>
</body>
</html>
